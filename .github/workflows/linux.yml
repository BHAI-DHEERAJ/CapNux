name: CapNux Linux build

on:
  push:
    branches: [main, 'arena/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Test and package on Ubuntu
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Tauri and FFmpeg system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential curl wget file pkg-config patchelf \
            libssl-dev libxdo-dev librsvg2-dev libayatana-appindicator3-dev \
            libwebkit2gtk-4.1-dev ffmpeg

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Test editing model
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Test native media engine
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build Linux packages
        run: npm run tauri:build -- --bundles deb,appimage

      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: capnux-linux-${{ github.sha }}
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 14
